name = "codex-limit-telegram-bot"
main = "src/index.ts"
compatibility_date = "2026-07-07"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 1

[triggers]
crons = ["0 * * * *"]

[vars]
CLASSIFIER_PROVIDER = "jev"
TYPESAFE_MODEL = "jev-1.13.0"
OPENROUTER_MODEL = "nvidia/nemotron-3-ultra-550b-a55b:free"
OPENROUTER_APP_NAME = "Codex Limit Telegram Bot"
TARGET_USERNAME = "thsottiaux"
TARGET_USERNAMES = "thsottiaux,sama"
POLL_LOOKBACK_HOURS = "24"
RECENT_DECISION_LIMIT = "50"
PUBLIC_SUBSCRIPTIONS_ENABLED = "true"
TELEGRAM_SEND_DELAY_MS = "40"

[[kv_namespaces]]
binding = "MONITOR_STATE"
id = "f5f9dc86e75342e9a158e8d7c5478f7d"
preview_id = "2d6761322ab24d2896a854d0f2d9a672"

[[d1_databases]]
binding = "SUBSCRIPTIONS_DB"
database_name = "codex-limit-telegram-subscriptions"
database_id = "191e50b4-7ffc-4ea3-9876-5ccd4ea0e4c5"

[[queues.producers]]
binding = "TELEGRAM_DELIVERY_QUEUE"
queue = "codex-limit-telegram-delivery"

[[queues.consumers]]
queue = "codex-limit-telegram-delivery"
max_batch_size = 10

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]
